default:
  image: repository.bxplc.cn/es/build:v0.0.8
  before_script:
    - echo '====== 准备构建中  ========='
    - npm config set registry http://10.25.7.18:4873
    - npm config set //10.25.7.18:4873/:_authToken ${NPM_TOKEN}
    - yarn config set registry http://10.25.7.18:4873
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache
      - node_modules
stages:
  - build
  #- test
  - deploy

build-job:
  stage: build
  script:
    - yarn
  retry: 2

release beta job:
  stage: deploy
  script:
    - curl -o autoPublishBeta.js http://10.25.7.126:8000/baosky_script/autoPublishBeta.js
    - node autoPublishBeta.js prepare ${VERDACCIO_ADDRESS} ${CI_PROJECT_ID}
    - yarn
    - node autoPublishBeta.js publish ${VERDACCIO_ADDRESS} ${CI_PROJECT_ID}
    # - "curl -X POST --fail -F token=a599868cee03fb46a18d745e884968 -F ref=dev http://gitlab.bxplc.cn/api/v4/projects/19/trigger/pipeline"
  only:
    - main
  retry: 2
  except:
    refs:
      - tags

release alpha job:
  stage: deploy
  script:
    - curl -o autoPublishAlpha.js http://10.25.7.126:8000/baosky_script/autoPublishAlpha.js
    - node autoPublishAlpha.js prepare ${VERDACCIO_ADDRESS}
    - yarn
    - node autoPublishAlpha.js publish ${VERDACCIO_ADDRESS}
    # - "curl -X POST --fail -F token=a599868cee03fb46a18d745e884968 -F ref=alpha http://gitlab.bxplc.cn/api/v4/projects/19/trigger/pipeline"
  only:
    - dev

after_script:
  - echo "====== 构建结束 ========="
