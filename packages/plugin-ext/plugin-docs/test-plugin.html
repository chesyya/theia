<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试插件文档</title>
</head>
<body>
    <h1>测试插件</h1>
    <h2>简介</h2>
    <p>这是一个测试插件的文档，用于演示动态插入功能。</p>

    <h2>功能特性</h2>
    <ul>
        <li>功能一：自动代码补全</li>
        <li>功能二：语法高亮显示</li>
        <li>功能三：错误检测与提示</li>
    </ul>

    <h2>使用方法</h2>
    <h3>安装</h3>
    <p>通过插件市场搜索"测试插件"并点击安装。</p>

    <h3>配置</h3>
    <p>在设置中找到"测试插件"选项，进行个性化配置。</p>

    <h3>快捷键</h3>
    <ul>
        <li><code>Ctrl+Shift+P</code>: 打开命令面板</li>
        <li><code>Ctrl+Space</code>: 触发代码补全</li>
    </ul>

    <h2>API 参考</h2>
    <pre><code>
// 示例代码
plugin.activate(context => {
    console.log('插件已激活');
});
    </code></pre>
</body>
</html>
